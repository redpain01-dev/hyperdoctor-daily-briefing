name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions 예약 실행(cron)은 정시에 도는 게 보장되지 않고 실제로
    # 몇 시간씩 늦거나, 정각처럼 혼잡한 시각에는 드롭될 수 있다.
    # 혼잡한 정각/30분을 피해 한국시간 0시 7분~8시 37분 사이 30분마다
    # 반복 실행한다. 수시간 지연되더라도 아침 전에 도착할 여유를 확보한다.
    # (public 저장소라 Actions 실행 시간에 비용이 들지 않는다.)
    - cron: "7,37 15-23 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (static export)
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: npm run build

      - name: Verify current KST edition
        shell: bash
        run: |
          expected_date="$(TZ=Asia/Seoul date '+%Y년 %-m월 %-d일')"
          echo "Expected page date: ${expected_date}"
          grep -Fq "${expected_date}" out/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
