name: Daily briefing fallback

on:
  schedule:
    # 주 배포 워크플로의 예약 이벤트가 생성되지 않는 경우를 위한 별도 등록이다.
    # UTC 15:47·17:47·19:47 = KST 00:47·02:47·04:47
    - cron: "47 15,17,19 * * *"
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
